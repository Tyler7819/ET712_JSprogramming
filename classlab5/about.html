<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>About Us | ET712</title>
	<style>
		:root {
			--forest: #173b35;
			--mist: #f2f4ed;
			--white: #ffffff;
		}

		* {
			box-sizing: border-box;
		}

		body {
			background: var(--mist);
			color: var(--forest);
			font-family: Georgia, serif;
			margin: 0;
		}

		.site-header {
			align-items: center;
			background: var(--forest);
			display: flex;
			justify-content: space-between;
			padding: 18px 6vw;
		}

		.logo {
			color: var(--white);
			font-family: Arial, sans-serif;
			font-size: 1.25rem;
			font-weight: bold;
		}

		.site-header nav {
			display: flex;
			gap: 28px;
		}

		.site-header a {
			color: var(--white);
			font-family: Arial, sans-serif;
			font-size: 0.95rem;
			text-decoration: none;
		}

		.site-header a:hover,
		.site-header a:focus {
			text-decoration: underline;
		}

		.hero {
			align-items: center;
			background-image: linear-gradient(rgba(16, 45, 37, 0.35), rgba(16, 45, 37, 0.6)), url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1800&auto=format&fit=crop");
			background-position: center;
			background-size: cover;
			display: flex;
			justify-content: center;
			min-height: 70vh;
			padding: 80px 6vw;
			text-align: center;
		}

		.hero-content {
			color: var(--white);
			max-width: 680px;
		}

		.hero h1 {
			font-size: clamp(2.5rem, 7vw, 5.5rem);
			line-height: 1;
			margin: 0 0 20px;
		}

		.hero p {
			font-size: clamp(1.05rem, 2vw, 1.35rem);
			line-height: 1.6;
			margin: 0;
		}

		.contact {
			padding: 56px 6vw;
			text-align: center;
		}

		.contact h2 {
			margin: 0 0 10px;
		}

		.contact a {
			color: var(--forest);
			font-family: Arial, sans-serif;
			font-weight: bold;
		}

		@media (max-width: 520px) {
			.site-header {
				align-items: flex-start;
				flex-direction: column;
				gap: 14px;
			}

			.site-header nav {
				gap: 18px;
			}
		}
	</style>
</head>
<body>
	<header class="site-header">
		<div class="logo">ET712</div>
		<nav aria-label="Main navigation">
			<a href="lab5.html">Home</a>
			<a href="#contact">Contact Us</a>
		</nav>
	</header>

	<main>
		<section class="hero" aria-labelledby="hero-title">
			<div class="hero-content">
				<h1 id="hero-title">Find Your Wild</h1>
				<p>Step outside, slow down, and let the natural world remind you what matters.</p>
			</div>
		</section>

		<section class="contact" id="contact" aria-labelledby="contact-title">
			<h2 id="contact-title">Contact Us</h2>
			<p>Have a question? <a href="mailto:hello@example.com">Send us an email</a>.</p>
		</section>
	</main>
</body>
</html>
